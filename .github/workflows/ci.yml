name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: route_deviation
          POSTGRES_USER: route_app
          POSTGRES_PASSWORD: route_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U route_app -d route_deviation"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.2-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://route_app:route_ci@localhost:5432/route_deviation
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
