name: route-deviation

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-route_deviation}
      POSTGRES_USER: ${POSTGRES_USER:-route_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-route_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/00-enable-postgis.sql:/docker-entrypoint-initdb.d/00-enable-postgis.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      ALGORITHM_VERSION: ${ALGORITHM_VERSION:-unimplemented}
      THRESHOLD_CONFIG_VERSION: ${THRESHOLD_CONFIG_VERSION:-v1}
      ROUTING_DATA_VERSION: ${ROUTING_DATA_VERSION:-not_configured}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://route_app:route_dev_only@db:5432/route_deviation}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-route-deviation:events}
      OSRM_URL: ${OSRM_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

